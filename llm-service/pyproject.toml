[project]
name = "nimidd-llm-service"
version = "0.1.0"
description = "REST palm OCR and LLM service for Nimidd"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.125.0",
  "numpy>=2.0.0",
  "opencv-python-headless>=4.10.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34.0",
]

[project.scripts]
llm-service = "llm_service.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_service"]
