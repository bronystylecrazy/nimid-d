version: '3'

vars:
  IMAGE: oci.devsirawit.com/nimidd:latest
  PLATFORM: linux/arm64

tasks:
  docker:
    desc: Build the Docker image locally, then push it
    cmds:
      - task docker:build
      - task docker:push

  docker:push:
    desc: Build and push the Docker image
    cmds:
      - docker buildx build --platform {{.PLATFORM}} -t {{.IMAGE}} --push .

  docker:build:
    desc: Build the Docker image locally for the configured platform
    cmds:
      - docker buildx build --platform {{.PLATFORM}} -t {{.IMAGE}} --load .
