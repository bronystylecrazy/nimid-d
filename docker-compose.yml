services:
  nimidd:
    image: oci.devsirawit.com/nimidd:latest
    platform: linux/arm64
    container_name: nimidd
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mqtt
      - llm-service
    environment:
      MQTT_BROKER_URL: mqtt://127.0.0.1:1883
      LLM_SERVICE_URL: http://127.0.0.1:8000
      DB_PATH: /app/data/nimidd.sqlite
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - ./data:/app/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  mqtt:
    image: eclipse-mosquitto:2
    platform: linux/arm64
    container_name: nimidd-mqtt
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
      - "18883:9001"

  llm-service:
    build:
      context: ./llm-service
    platform: linux/arm64
    container_name: nimidd-llm-service
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_SIAMSEE_MODEL: ${OPENAI_SIAMSEE_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      HTTP_PORT: 8000
      LLM_OUTPUT_DIR: /app/output
    ports:
      - "8000:8000"
    volumes:
      - ./llm-service/output:/app/output

  watchtower:
    image: containrrr/watchtower:latest
    container_name: nimidd-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --label-enable
      - --cleanup
      - --interval
      - "5"
