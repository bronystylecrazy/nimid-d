services:
  nimidd:
    build:
      context: .
    image: nimidd:local
    container_name: nimidd
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    environment:
      PORT: 80
      STATIC_DIR: /app/dist
      MQTT_BROKER_URL: mqtt://mqtt:1883
      LLM_SERVICE_URL: http://llm-service:8000
      DB_PATH: /app/data/nimidd.sqlite
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "${APP_PORT:-5173}:80"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r=await fetch('http://127.0.0.1/api/session'); if (!r.ok) process.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mqtt:
    image: eclipse-mosquitto:2
    container_name: nimidd-mqtt
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${MQTT_PORT:-1884}:1883"
      - "${MQTT_WS_PORT:-18883}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -m ok >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  llm-service:
    build:
      context: ./llm-service
    container_name: nimidd-llm-service
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_SIAMSEE_MODEL: ${OPENAI_SIAMSEE_MODEL:-}
      OPENAI_SENTIMENT_MODEL: ${OPENAI_SENTIMENT_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      HTTP_PORT: 8000
      LLM_OUTPUT_DIR: /app/output
    ports:
      - "${LLM_PORT:-8000}:8000"
    volumes:
      - ./llm-service/output:/app/output
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  watchtower:
    image: containrrr/watchtower:latest
    container_name: nimidd-watchtower
    profiles:
      - deploy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --label-enable
      - --cleanup
      - --interval
      - "5"
